<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no" />
<meta name="mrbd-web-app-capable" content="yes" />
<title>Score Scroll</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="stage">

  <!-- LIBRARY -->
  <div id="library" class="screen active focusable" tabindex="0">
    <h1>🎀 Score Scroll 🎀</h1>
    <div class="tag">✨ upload a score · scroll it on the beat ✨</div>
    <div id="songList"></div>
    <div class="foot">swipe ↑↓ to choose · pinch to open</div>
    <input id="fileInput" type="file" accept=".musicxml,.xml,.mxl" hidden />
  </div>

  <!-- PLAYER -->
  <div id="player" class="screen focusable" tabindex="0">
    <div id="pTitle">—</div>
    <div id="lane"><div id="strip"><div id="notation"></div></div></div>
    <div id="playhead"></div>
    <div id="countin"></div>
    <div id="bar"><div id="barFill"></div></div>
    <div id="pHint">pinch = play/pause · ↑↓ tempo · ← back a bar · → skip a bar</div>
    <div id="hud">
      <div><span class="k">TEMPO</span><span class="v"><span id="bpm">120</span> bpm</span></div>
      <div><span class="k">STATE</span><span class="v paused" id="pState">paused</span></div>
      <div><span class="k">BAR</span><span class="v" id="barNum">1</span></div>
    </div>
  </div>

  <!-- toast -->
  <div id="toast"></div>
</div>

<script src="lib/osmd.min.js"></script>
<script src="js/render.js"></script>
<script src="js/player.js"></script>
<script src="js/library.js"></script>
<script src="js/app.js"></script>
</body>
</html>
